<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="frame-src https://www.youtube.com https://www.google.com https://open.spotify.com;">
    <title>LoveStory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary, #A56CB9)',
              'primary-dark': 'var(--color-primary-dark, #86499B)',
              'on-primary': 'var(--color-on-primary, #ffffff)',
              'primary-icon-bg': 'var(--color-primary-icon-bg, rgba(165,108,185,0.22))',
              'primary-icon-bg-dark': 'var(--color-primary-icon-bg-dark, rgba(165,108,185,0.35))',
              secondary: '#F3E5F5',
              gold: '#D4A373',
              'bg-light': '#FCF5FD',
              'bg-dark': '#1E1220',
              'card-white': 'rgba(255, 255, 255, 0.7)',
              'card-dark': 'rgba(30, 30, 30, 0.7)',
            },
            fontFamily: {
              display: ['"Playfair Display"', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .font-display {
        font-family: 'Playfair Display', serif;
      }
      /* Glassmorphism: same strength as login (backdrop-blur-xl = 24px).
         isolation: isolate + transform creates stacking context so backdrop-filter works
         even with overflow on ancestors (e.g. overflow-x-hidden). */
      .glass-panel {
        isolation: isolate;
        backdrop-filter: blur(24px) !important;
        -webkit-backdrop-filter: blur(24px) !important;
        transform: translateZ(0);
      }
      .glass-card {
        isolation: isolate;
        backdrop-filter: blur(24px) !important;
        -webkit-backdrop-filter: blur(24px) !important;
        background: rgba(255, 255, 255, 0.5);
        transform: translateZ(0);
      }
      .dark .glass-card {
        background: rgba(15, 23, 42, 0.5);
      }
      .btn-glass {
        isolation: isolate;
        backdrop-filter: blur(24px) !important;
        -webkit-backdrop-filter: blur(24px) !important;
        background: rgba(255, 255, 255, 0.5);
        transform: translateZ(0);
      }
      .dark .btn-glass {
        background: rgba(30, 41, 59, 0.5);
      }
      /* Hide scrollbar for horizontal scrolling areas */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-bg-light dark:bg-bg-dark text-slate-800 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
